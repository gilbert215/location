<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sangiza aho uherereye</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 0 auto; padding: 20px 16px; color: #222; background: #fff; }
    h1 { font-size: 22px; margin-bottom: 4px; }
    p.sub { color: #555; margin-top: 0; }
    label { display: block; margin: 14px 0 4px; font-weight: bold; font-size: 14px; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; border: 1px solid #bbb; border-radius: 6px; font-family: inherit; }
    button { width: 100%; margin-top: 20px; padding: 14px; font-size: 17px; border: 0; border-radius: 6px; background: #1a7f37; color: #fff; }
    button:disabled { background: #999; }
    #status { margin-top: 16px; padding: 12px; border-radius: 6px; display: none; }
    .ok { background: #e6f4ea; color: #1a7f37; }
    .err { background: #fdecea; color: #b3261e; }
    .info { background: #eef3fb; color: #1f4e8c; }
  </style>
</head>
<body>
  <h1>Sangiza aho uherereye</h1>
  <p class="sub">Uzuza iyi form iri hasi , nibagusaba gufungura location ukande kuri <b>Allow</b> (Emera). Tegereza kugeza ubutumwa bwo gushimira bugaragaye.</p>

  <label for="site">Izina ry'ahantu (ni ngombwa) *</label>
  <input id="site" type="text" maxlength="100" required placeholder="Urugero: Nyagatare, Karangazi">

  <label for="name">Amazina yawe (si ngombwa)</label>
  <input id="name" type="text" maxlength="100">

  <label for="note">Ibisobanuro by'inyongera (si ngombwa)</label>
  <textarea id="note" rows="2" maxlength="200"></textarea>

  <button id="btn" onclick="share()">Ohereza aho ndi</button>
  <div id="status"></div>

  <script>
    // PASTE YOUR APPS SCRIPT /exec URL BETWEEN THE QUOTES:
    var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwnqLlfCl7eH4vNkmCUkjhQKx9bvxV7Hmtu0HB_msclgL1WvmJD8fnYAgCnEsGALCD3/exec';

    var TARGET_ACCURACY = 15;   // metres: stop as soon as a reading is this good
    var MAX_WAIT_MS = 60000;    // otherwise keep the best reading for up to 60 s

    // If the link has ?site=..., pre-fill the site box (people can still edit it).
    var urlSite = new URLSearchParams(window.location.search).get('site') || '';
    document.getElementById('site').value = urlSite.replace(/_/g, ' ');

    function show(msg, cls) {
      var s = document.getElementById('status');
      s.className = cls; s.style.display = 'block'; s.textContent = msg;
    }

    function share() {
      var btn = document.getElementById('btn');
      var siteBox = document.getElementById('site');
      var site = siteBox.value.trim();
      if (!site) {
        show('Andika izina ry\'ahantu mbere yo kohereza.', 'err');
        siteBox.style.borderColor = '#b3261e';
        siteBox.focus();
        return;
      }
      siteBox.style.borderColor = '';
      if (!navigator.geolocation) {
        show('Iyi browser ntishobora kohereza aho uri. Gerageza ukoresheje Chrome kuri telefoni yawe.', 'err');
        return;
      }
      btn.disabled = true;
      show('Turimo gushaka aho uri… tegereza gato (kugeza ku munota 1).', 'info');

      var best = null;
      var done = false;
      var start = Date.now();

      function finish() {
        if (done) return;
        done = true;
        navigator.geolocation.clearWatch(watchId);
        clearTimeout(timer);
        if (!best) {
          btn.disabled = false;
          show('Ntibishobotse kubona aho uri. Fungura Location (GPS), ujye hanze, hanyuma wongere ugerageze.', 'err');
          return;
        }
        send(best, site);
      }

      var watchId = navigator.geolocation.watchPosition(function (pos) {
        if (!best || pos.coords.accuracy < best.coords.accuracy) best = pos;
        var secs = Math.round((Date.now() - start) / 1000);
        show('Turimo kunoza ibipimo… ubwizerwe ubu: hafi metero ' + Math.round(best.coords.accuracy) +
             ' (amasegonda ' + secs + '). Tegereza.', 'info');
        if (best.coords.accuracy <= TARGET_ACCURACY) finish();
      }, function (err) {
        if (err.code === 1) {             // permission denied: stop immediately
          done = true;
          navigator.geolocation.clearWatch(watchId);
          clearTimeout(timer);
          btn.disabled = false;
          show('Ntiwatanze uburenganzira bwo kumenya aho uri. Emera (Allow) Location kuri iyi paji hanyuma wongere ugerageze.', 'err');
        }
        // other errors: keep waiting; the timer will finish with the best reading so far
      }, { enableHighAccuracy: true, maximumAge: 0, timeout: MAX_WAIT_MS });

      var timer = setTimeout(finish, MAX_WAIT_MS);
    }

    function send(pos, site) {
      var btn = document.getElementById('btn');
      var data = {
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        accuracy: pos.coords.accuracy,
        site: site,
        name: document.getElementById('name').value,
        note: document.getElementById('note').value
      };
      show('Birimo kubikwa…', 'info');

      fetch(SCRIPT_URL, {
        method: 'POST',
        // text/plain avoids a CORS preflight, which Apps Script doesn't support
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(data)
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (!res.ok) throw new Error(res.error || 'error');
          show('Murakoze! Aho uri hamaze kwandikwa. Ubwizerwe bw\'ibipimo: hafi metero ' + Math.round(data.accuracy) + '.', 'ok');
        })
        .catch(function () {
          btn.disabled = false;
          show('Ntibyabitswe. Reba ko ufite interineti hanyuma wongere ugerageze.', 'err');
        });
    }
  </script>
</body>
</html>
